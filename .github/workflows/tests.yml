name: Tests

# Exécute la suite de tests à chaque push et à chaque pull request
# (donc avant et lors d'un merge) sur la branche principale.
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  # 1) Qualité du code : formatage et linting avec Ruff.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation de Ruff
        run: |
          python -m pip install --upgrade pip
          # Version épinglée : les règles de Ruff (tri d'imports, formatage)
          # évoluent d'une version à l'autre. On fige la même version qu'en
          # local et dans pre-commit pour garantir un résultat identique.
          pip install ruff==0.15.19

      - name: Vérification du formatage (ruff format)
        run: ruff format --check .

      - name: Vérification du lint (ruff check)
        run: ruff check .

  # 2) Tests unitaires sur plusieurs versions de Python.
  test:
    runs-on: ubuntu-latest
    needs: lint   # les tests ne tournent que si le code est bien formaté
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lancement des tests
        run: pytest -v
